// Joy-Con / Gamepad input
// The game polls controller state directly every frame. Browser/Android still owns
// the underlying HID connection, but this keeps gameplay input responsive.
const joycons = new Map();
const JOYCON_VENDOR = 0x057e;
const JOYCON_PRODUCTS = new Set([0x2006, 0x2007]);
const joyconState = {x:0,z:0,fire:false,booyah:false};

function joyconStick(data, offset) {
  if (data.byteLength < offset + 3) return {x:0,y:0};
  const x = data.getUint8(offset) | ((data.getUint8(offset+1) & 0x0f) << 8);
  const y = (data.getUint8(offset+1) >> 4) | (data.getUint8(offset+2) << 4);
  return {
    x: THREE.MathUtils.clamp((x-2048)/2048,-1,1),
    y: THREE.MathUtils.clamp((2048-y)/2048,-1,1)
  };
}

function handleJoyconReport(event) {
  const d = event.data;
  if (event.reportId !== 0x30 || d.byteLength < 12) return;
  const device = event.device;
  const isLeft = device.productId === 0x2006;
  const stick = joyconStick(d, isLeft ? 6 : 9);

  if (isLeft) {
    joyconState.x = stick.x;
    joyconState.z = -stick.y;
  } else if (Math.abs(joyconState.x) < AXIS_DEADZONE && Math.abs(joyconState.z) < AXIS_DEADZONE) {
    joyconState.x = stick.x;
    joyconState.z = -stick.y;
  }

  const bR = d.getUint8(3);
  const bL = d.getUint8(5);
  joyconState.fire = !!(bR & 0x08) || !!(bR & 0x40) || !!(bR & 0x80) || !!(bL & 0x40) || !!(bL & 0x80);
  joyconState.booyah = !!(bL & 0x01);
}

async function setupJoyCon(device) {
  if (!device) return;
  try {
    if (!device.opened) await device.open();
  } catch (err) {
    console.warn("Joy-Con HID open failed", err);
    return;
  }

  device.removeEventListener("inputreport", handleJoyconReport);
  device.addEventListener("inputreport", handleJoyconReport);

  try {
    await device.sendReport(0x01, new Uint8Array([1,0,1,64,64,0,1,64,64,0x40,0x01]));
    await new Promise(r => setTimeout(r, 500));
    await device.sendReport(0x01, new Uint8Array([1,0,64,64,0,1,64,64,0x03,0x30]));
  } catch (err) {
    console.warn("Joy-Con setup command failed", err);
  }

  joycons.set(device.productId, device);
  const button = document.getElementById("joycon");
  const status = document.getElementById("status");
  button.textContent = joycons.size > 1 ? "JOY-CONS CONNECTED" : "JOY-CON CONNECTED";
  status.textContent = `JOY-CON READY • ${device.productName || "Nintendo controller"}`;
}

async function connectJoyCon() {
  const status = document.getElementById("status");
  const button = document.getElementById("joycon");

  if (!("hid" in navigator)) {
    status.textContent = "WebHID unavailable • Using Gamepad API";
    return;
  }

  button.disabled = true;
  button.textContent = "REQUESTING JOY-CON…";
  status.textContent = "WAITING FOR JOY-CON PERMISSION…";

  try {
    const devices = await navigator.hid.requestDevice({
      filters: [
        {vendorId: JOYCON_VENDOR, productId: 0x2006},
        {vendorId: JOYCON_VENDOR, productId: 0x2007}
      ]
    });

    if (!devices.length) {
      status.textContent = "NO WEBHID JOY-CON • Using Gamepad API";
      button.textContent = "CONNECT JOY-CON";
      button.disabled = false;
      return;
    }

    for (const device of devices) await setupJoyCon(device);
    button.disabled = false;
  } catch (err) {
    console.warn("WebHID Joy-Con connection failed; using Gamepad API", err);
    status.textContent = "JOY-CON ACTIVE VIA GAMEPAD API";
    button.textContent = "JOY-CON READY";
    button.disabled = false;
  }
}

document.getElementById("joycon").addEventListener("click", connectJoyCon);

    if (!joycons.size) {

      joyconState.z = 0;
      joyconState.fire = false;
      joyconState.booyah = false;
      document.getElementById("joycon").textContent = "CONNECT JOY-CON";
      document.getElementById("joycon").disabled = false;

      .filter(d => d.vendorId === JOYCON_VENDOR && JOYCON_PRODUCTS.has(d.productId))

    .catch(() => {});
}

let controllerIndex = null;
let booyahLatch = false;
let joyconFireLatch = false;
let joyconBooyahLatch = false;
const AXIS_DEADZONE = 0.15;

function getControllers() {
  return navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(Boolean) : [];
}

function updateGamepadStatus() {
  const pads = getControllers().filter(g => g?.connected);
  const status = document.getElementById("status");
  if (!status) return;

  if (pads.length) {
    const names=pads.map(g=>g.id||"GAMEPAD").join(" + ");
    if(!joycons.size)status.textContent=`GAMEPAD ACTIVE: ${names}`;
  }else{
    if(!joycons.size&&status.textContent.startsWith("GAMEPAD ACTIVE:"))status.textContent=renderer.xr.isPresenting?"VR ACTIVE • Look + ink":"Ready";
  }
}

  updateGamepadStatus();

window.addEventListener("gamepaddisconnected", e => {

function joyconInput() {
  const fire = !!joyconState.fire;
  const booyahPressed = !!joyconState.booyah;

  if (fire && !joyconFireLatch && typeof shoot === "function") shoot();
  if (booyahPressed && !joyconBooyahLatch && typeof booyah === "function") booyah();

  joyconFireLatch = fire;
  joyconBooyahLatch = booyahPressed;

  let x = joyconState.x || 0;
  let z = joyconState.z || 0;
  if (Math.abs(x) < AXIS_DEADZONE) x = 0;
  if (Math.abs(z) < AXIS_DEADZONE) z = 0;
  return { x, z };
}

function controllerInput() {
  // Poll directly every frame. This does not override Chrome/Android ownership,
  // but avoids waiting for browser events before gameplay sees the current state.
  const pads = getControllers().filter(gp => gp?.connected);
  if (!pads.length) return { x: 0, z: 0 };

  let x = 0;
  let z = 0;
  let booyahPressed = false;
  let firePressed = false;

  for (const gp of pads) {
    // KEEP THE EXISTING AXIS MAPPING UNCHANGED.
    const padX = Number.isFinite(gp.axes?.[0]) ? gp.axes[0] : 0;
    const padZ = Number.isFinite(gp.axes?.[1]) ? gp.axes[1] : 0;

    if (Math.abs(padX) > AXIS_DEADZONE) x = padX;
    if (Math.abs(padZ) > AXIS_DEADZONE) z = padZ;

    if (Math.abs(x) <= AXIS_DEADZONE && Math.abs(z) <= AXIS_DEADZONE) {
      if (gp.buttons[14]?.pressed) x = -1;
      if (gp.buttons[15]?.pressed) x = 1;
      if (gp.buttons[12]?.pressed) z = -1;
      if (gp.buttons[13]?.pressed) z = 1;
    }

    // Broad button fallback for Android/Chrome Joy-Con mappings.
    if (gp.buttons[0]?.pressed || gp.buttons[1]?.pressed ||
        gp.buttons[2]?.pressed || gp.buttons[3]?.pressed ||
        gp.buttons[6]?.pressed || gp.buttons[7]?.pressed) {
      firePressed = true;
    }

    if (gp.buttons[8]?.pressed || gp.buttons[9]?.pressed ||
        gp.buttons[10]?.pressed || gp.buttons[11]?.pressed) {
      booyahPressed = true;
    }
  }

  if (firePressed && !joyconFireLatch && typeof shoot === "function") shoot();
  if (booyahPressed && !booyahLatch && typeof booyah === "function") booyah();

  joyconFireLatch = firePressed;
  booyahLatch = booyahPressed;
  return { x, z };
}

  if(amount<.15){

    playerBody.userData.rightArm.rotation.z=restRight;
    playerBody.userData.leftArm.rotation.x=0;
    playerBody.userData.rightArm.rotation.x=0;
    playerBody.userData.leftElbow.rotation.z=0;
    playerBody.userData.rightElbow.rotation.z=0;
    return;
  }
  playerBody.userData.leftArm.rotation.z=restLeft-leanX;
  playerBody.userData.rightArm.rotation.z=restRight+leanX;
  playerBody.userData.leftArm.rotation.x=lift;
  playerBody.userData.rightArm.rotation.x=lift;
  const elbowBend=Math.max(0,Math.abs(lift)+Math.abs(leanX)-.15)*.7;
  playerBody.userData.leftElbow.rotation.z=-elbowBend;
  playerBody.userData.rightElbow.rotation.z=elbowBend;
}
function getArmTestInput(){
  if(!armTestMode)return {x:0,z:0};
  const pads=getControllers().filter(gp=>gp?.connected);
  for(const gp of pads){
    const x=Number.isFinite(gp.axes?.[2])?gp.axes[2]:0;
    const z=Number.isFinite(gp.axes?.[3])?gp.axes[3]:0;
    if(Math.abs(x)>.15||Math.abs(z)>.15)return {x,z};
  }
  return {x:0,z:0};
}

function animate(){const dt=Math.min(clock.getDelta(),.05);updateBodyForView();shotCooldown=Math.max(0,shotCooldown-dt);updateSquidForm();for(const m of targetMotion){if(m.t.material.color.getHex()!==0x22d3ee){m.t.position.x=m.homeX+Math.sin(performance.now()*.0012+m.phase)*.65;m.t.position.y=1.3+Math.sin(performance.now()*.0017+m.phase)*.18}}updateGamepadStatus();const pad=controllerInput();const jc=joyconInput();const touchX=(keys.has("right")?1:0)-(keys.has("left")?1:0);const touchZ=(keys.has("down")?1:0)-(keys.has("up")?1:0);const inputX=Math.abs(jc.x)>.15?jc.x:(Math.abs(pad.x)>.15?pad.x:touchX);const inputZ=Math.abs(jc.z)>.15?jc.z:(Math.abs(pad.z)>.15?pad.z:touchZ);const inputLen=Math.hypot(inputX,inputZ);const armInput=getArmTestInput();updateTestArms(armInput.x,armInput.z);let targetVX=0,targetVZ=0;if(inputLen>.01){
  targetVX=inputX/inputLen;
  targetVZ=inputZ/inputLen;
  const speed=squidForm?4.2:2.4;
  const xrCam=renderer.xr.isPresenting?renderer.xr.getCamera():camera;
  const forward=new THREE.Vector3(0,0,-1).applyQuaternion(xrCam.quaternion);
  forward.y=0;
  if(forward.lengthSq()<.0001)forward.set(0,0,-1);
  forward.normalize();
  const right=new THREE.Vector3(1,0,0).applyQuaternion(xrCam.quaternion);
  right.y=0;
  right.normalize();
  const dir=new THREE.Vector3().addScaledVector(right,targetVX).addScaledVector(forward,-targetVZ);
  if(dir.lengthSq()<.0001)dir.set(0,0,-1);
  dir.normalize();
  targetVX=dir.x*speed;
  targetVZ=dir.z*speed;
}const response=inputLen>.01?10:14;moveVelocity.x=THREE.MathUtils.damp(moveVelocity.x,targetVX,response,dt);moveVelocity.z=THREE.MathUtils.damp(moveVelocity.z,targetVZ,response,dt);player.position.x+=moveVelocity.x*dt;player.position.z+=moveVelocity.z*dt;player.position.x=THREE.MathUtils.clamp(player.position.x,-6.2,6.2);player.position.z=THREE.MathUtils.clamp(player.position.z,-6.2,6.2);renderer.render(scene,camera)}
renderer.setAnimationLoop(animate);bootStatus.textContent="3D READY • Enter VR";addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
