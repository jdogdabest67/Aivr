<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controller Diagnostic</title>
<style>
html,body{margin:0;min-height:100%;background:#10131c;color:#fff;font-family:system-ui,sans-serif}
body{padding:18px;box-sizing:border-box}
h1{font-size:22px;margin:0 0 8px}
p{color:#b9c0d0}
.card{background:#1b2130;border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #ffffff12}
.value{font-family:monospace;color:#7dd3fc;text-align:right;word-break:break-word}
.pressed{color:#fbbf24;font-weight:800}
.small{font-size:13px;color:#94a3b8}
</style>
</head>
<body>
<h1>🎮 Controller Diagnostic</h1>
<p>Connect your controller, then press buttons and move the sticks.</p>
<div class="card">
<div class="row"><span>Status</span><span id="status" class="value">No controller detected</span></div>
<div class="row"><span>Controller</span><span id="name" class="value">none</span></div>
</div>
<div class="card"><h3>Sticks / axes</h3><div id="axes"></div></div>
<div class="card"><h3>Buttons</h3><div id="buttons"></div></div>
<p class="small">Squeeze the right trigger and tell me which Button number changes.</p>
<script>
let selected=null;
function findGamepad(){
 const pads=navigator.getGamepads?navigator.getGamepads():[];
 if(selected!==null&&pads[selected]&&pads[selected].connected)return pads[selected];
 for(const gp of pads)if(gp&&gp.connected){selected=gp.index;return gp;}
 selected=null;return null;
}
function render(){
 const gp=findGamepad(),status=document.getElementById("status"),name=document.getElementById("name");
 const axes=document.getElementById("axes"),buttons=document.getElementById("buttons");
 if(!gp){
  status.textContent="No controller detected";name.textContent="none";
  axes.innerHTML='<div class="small">No axes available.</div>';
  buttons.innerHTML='<div class="small">No buttons available.</div>';
 }else{
  status.textContent="Controller detected";
  name.textContent=gp.id+" [index "+gp.index+"]";
  axes.innerHTML=gp.axes.map((v,i)=>'<div class="row"><span>Axis '+i+'</span><span class="value '+(Math.abs(v)>.12?'pressed':'')+'">'+v.toFixed(3)+'</span></div>').join("");
  buttons.innerHTML=gp.buttons.map((b,i)=>'<div class="row"><span>Button '+i+'</span><span class="value '+(b.pressed||b.value>.12?'pressed':'')+'">pressed='+b.pressed+' value='+b.value.toFixed(3)+'</span></div>').join("");
 }
 requestAnimationFrame(render);
}
addEventListener("gamepadconnected",e=>selected=e.gamepad.index);
addEventListener("gamepaddisconnected",e=>{if(selected===e.gamepad.index)selected=null});
render();
</script>
</body>
</html>
