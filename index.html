<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ink Arena VR</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#080b18;font-family:system-ui,sans-serif;color:white}
#ui{position:fixed;z-index:5;top:12px;left:12px;right:12px;pointer-events:none}.card{display:inline-block;padding:9px 12px;border-radius:12px;background:#000a;backdrop-filter:blur(7px);font-size:13px}#status{color:#a7f3d0}#stats{margin-top:6px}
#controls{position:fixed;z-index:6;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.pad{display:grid;grid-template-columns:48px 48px 48px;gap:6px;pointer-events:auto}.pad button,.action{width:48px;height:48px;border:0;border-radius:14px;background:#ffffff25;color:white;font-size:20px}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1}.pad button:nth-child(3){grid-column:2}.pad button:nth-child(4){grid-column:3}.actions{display:flex;gap:8px;align-items:end;pointer-events:auto}.fire{width:72px;height:72px;border-radius:50%;background:#f97316;font-size:14px;font-weight:800}.booyah{width:72px;height:56px;border-radius:16px;background:#22d3ee;font-size:12px;font-weight:900}
.topJoycon{margin-top:8px;padding:9px 12px;border:0;border-radius:10px;background:#ffffff25;color:white;font-weight:800;font-size:12px;pointer-events:auto}.topJoycon:active{transform:scale(.97)}#cross{position:fixed;z-index:4;left:50%;top:50%;width:10px;height:10px;margin:-5px;border:2px solid white;border-radius:50%;pointer-events:none}#booyahFlash{position:fixed;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none;font-size:42px;font-weight:1000;opacity:0;transform:scale(.8)}#booyahFlash.show{animation:booyah .65s ease-out}@keyframes booyah{0%{opacity:0;transform:scale(.7) rotate(-5deg)}20%{opacity:1;transform:scale(1.15) rotate(3deg)}100%{opacity:0;transform:scale(1.5)}}
</style>
</head>
<body>
<div id="ui"><div class="card"><b>🦑 INK ARENA VR</b><br><span id="status">Press ENTER VR</span><div id="stats">Ink: 0 • Targets: 0/5 • Booyah: 0</div><button id="joycon" class="topJoycon">CONNECT JOY-CON</button></div></div>
<div id="cross"></div><div id="booyahFlash">BOOYAH! 🦑</div>
<div id="controls"><div class="pad"><button data-move="up">▲</button><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div><div class="actions"><button class="action booyah" id="booyah">BOOYAH!</button><button class="action fire" id="fire">INK!</button><button class="action" id="reset">RESET</button></div></div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import {VRButton} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js";
const scene=new THREE.Scene();scene.background=new THREE.Color(0x11152b);scene.fog=new THREE.Fog(0x11152b,8,32);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.03,100);camera.position.y=1.6;
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;document.body.appendChild(renderer.domElement);document.body.appendChild(VRButton.createButton(renderer));
scene.add(new THREE.HemisphereLight(0xffffff,0x172033,1.5));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(3,8,2);scene.add(sun);
const player=new THREE.Group();player.position.set(0,0,4);player.add(camera);scene.add(player);
const floor=new THREE.Mesh(new THREE.BoxGeometry(14,.12,14),new THREE.MeshStandardMaterial({color:0x28304a,roughness:.85}));floor.position.y=-.06;scene.add(floor);
const wallMat=new THREE.MeshStandardMaterial({color:0x3d4660});for(const [x,z,sx,sz] of [[0,-7,14,.15],[-7,0,.15,14],[7,0,.15,14],[0,7,14,.15]]){const w=new THREE.Mesh(new THREE.BoxGeometry(sx,3,sz),wallMat);w.position.set(x,1.5,z);scene.add(w)}
for(const [x,z] of [[-3,-2],[3,-2],[-2,1],[2,2],[0,-4]]){const o=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2),new THREE.MeshStandardMaterial({color:0x64748b}));o.position.set(x,.6,z);scene.add(o)}
const targets=[];const targetHomes=[[-4,-5],[0,-5],[4,-5],[-4,0],[4,0]];for(const [x,z] of targetHomes){const t=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.15,24),new THREE.MeshStandardMaterial({color:0xf472b6,emissive:0x4a102d,emissiveIntensity:.5}));t.rotation.x=Math.PI/2;t.position.set(x,1.3,z);scene.add(t);targets.push(t)}
const targetMotion=targets.map((t,i)=>({t,homeX:t.position.x,homeZ:t.position.z,phase:i*1.7}));
const inkGroup=new THREE.Group();scene.add(inkGroup);const inkMat=new THREE.MeshStandardMaterial({color:0x22d3ee,emissive:0x064e5b,emissiveIntensity:.45,transparent:true,opacity:.9,roughness:.7});
let inkCount=0,targetCount=0,booyahCount=0;let inkArea=0,shotCooldown=0;
function updateStats(){document.getElementById("stats").textContent="Ink: "+inkCount+" • Targets: "+targetCount+"/5 • Paint: "+inkArea+"% • Booyah: "+booyahCount}
function makeInk(point){const size=.35+Math.random()*.65;inkArea=Math.min(100,Math.round(inkGroup.children.length/1.8));const m=new THREE.Mesh(new THREE.CircleGeometry(size,20),inkMat);m.rotation.x=-Math.PI/2;m.position.set(point.x,.012,point.z);m.scale.x=.7+Math.random()*.6;m.scale.y=.7+Math.random()*.6;inkGroup.add(m);inkCount++;if(inkGroup.children.length>180)inkGroup.remove(inkGroup.children[0]);updateStats()}
const raycaster=new THREE.Raycaster();
function shoot(){if(shotCooldown>0)return;shotCooldown=.18;raycaster.setFromCamera(new THREE.Vector2(0,0),camera);const hits=raycaster.intersectObjects([floor,...targets],false);if(!hits.length)return;const hit=hits[0];if(hit.object!==floor&&hit.object.material.color.getHex()!==0x22d3ee){hit.object.material.color.set(0x22d3ee);hit.object.material.emissive.set(0x064e5b);hit.object.material.emissiveIntensity=.9;targetCount++}makeInk(hit.point);document.getElementById("status").textContent="INK!";setTimeout(()=>document.getElementById("status").textContent=renderer.xr.isPresenting?"VR ACTIVE":"Ready",180);updateStats();if(targetCount===targets.length)document.getElementById("status").textContent="ALL TARGETS INKED! 🎯"}
function booyah(){booyahCount++;updateStats();const f=document.getElementById("booyahFlash");f.classList.remove("show");void f.offsetWidth;f.classList.add("show");document.getElementById("status").textContent="BOOYAH!";setTimeout(()=>document.getElementById("status").textContent=renderer.xr.isPresenting?"VR ACTIVE":"Ready",650)}
document.getElementById("fire").addEventListener("click",shoot);document.getElementById("booyah").addEventListener("click",booyah);
function resetGame(){targetCount=0;inkCount=0;inkArea=0;booyahCount=0;shotCooldown=0;for(const {t,homeX,homeZ} of targetMotion){t.position.x=homeX;t.position.z=homeZ;t.material.color.set(0xf472b6);t.material.emissive.set(0x4a102d);t.material.emissiveIntensity=.5}while(inkGroup.children.length)inkGroup.remove(inkGroup.children[0]);player.position.set(0,0,4);squidForm=false;updateStats();document.getElementById("status").textContent=renderer.xr.isPresenting?"VR ACTIVE • Look + ink":"Ready"}
document.getElementById("reset").addEventListener("click",resetGame);
renderer.xr.addEventListener("sessionstart",()=>{squidForm=false;squidHeightReady=false;squidBaselineSamples=0;squidBaselineSum=0;squidEnterY=1.6;document.getElementById("status").textContent="VR ACTIVE • Look + ink"});
renderer.xr.addEventListener("sessionend",()=>document.getElementById("status").textContent="Ready");
const keys=new Set();const moveButtons={up:"up",down:"down",left:"left",right:"right"};document.querySelectorAll("[data-move]").forEach(b=>{const k=moveButtons[b.dataset.move];const down=e=>{e.preventDefault();keys.add(k)};const up=e=>{e.preventDefault();keys.delete(k)};b.addEventListener("pointerdown",down);b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);b.addEventListener("pointerleave",up)});
let controllerIndex=null,booyahLatch=false;const joycons=new Map();const JOYCON_VENDOR=0x057e;const JOYCON_PRODUCTS=new Set([0x2006,0x2007]);const joyconState={x:0,z:0,fire:false,booyah:false};
function joyconStick(data,offset){const x=data.getUint8(offset)|((data.getUint8(offset+1)&0x0f)<<8);const y=(data.getUint8(offset+1)>>4)|(data.getUint8(offset+2)<<4);return{x:THREE.MathUtils.clamp((x-2048)/2048,-1,1),y:THREE.MathUtils.clamp((2048-y)/2048,-1,1)}}
function handleJoyconReport(event){const d=event.data;if(event.reportId!==0x30||d.byteLength<12)return;const bR=d.getUint8(3),bL=d.getUint8(5);const device=event.device;const isLeft=device.productId===0x2006;const stick=joyconStick(d,isLeft?6:9);if(isLeft){joyconState.x=stick.x;joyconState.z=-stick.y}else if(Math.abs(joyconState.x)<.15&&Math.abs(joyconState.z)<.15){joyconState.x=stick.x;joyconState.z=-stick.y}joyconState.fire=!!(bR&0x08)||!!(bR&0x40)||!!(bR&0x80)||!!(bL&0x40)||!!(bL&0x80);joyconState.booyah=!!(bL&0x01)}
async function setupJoyCon(device){if(!device)return;if(!device.opened)await device.open();device.addEventListener("inputreport",handleJoyconReport);try{await device.sendReport(0x01,new Uint8Array([1,0,1,64,64,0,1,64,64,0x40,0x01]));await new Promise(r=>setTimeout(r,500));await device.sendReport(0x01,new Uint8Array([1,0,64,64,0,1,64,64,0x03,0x30]))}catch(err){console.warn("Joy-Con setup command failed",err)}joycons.set(device.productId,device);document.getElementById("joycon").textContent=joycons.size>1?"JOY-CONS CONNECTED":"JOY-CON CONNECTED";document.getElementById("status").textContent="JOY-CON READY 🕹️"}
async function connectJoyCon(){const status=document.getElementById("status");const button=document.getElementById("joycon");if(!("hid" in navigator)){status.textContent="WebHID unavailable in this browser";return}button.disabled=true;button.textContent="REQUESTING PERMISSION…";status.textContent="WAITING FOR JOY-CON PERMISSION…";try{const devices=await navigator.hid.requestDevice({filters:[]});if(devices.length){status.textContent="JOY-CON SELECTED • CONNECTING…";await setupJoyCon(devices[0])}else{status.textContent="NO JOY-CON SELECTED";button.textContent="CONNECT JOY-CON";button.disabled=false}}catch(err){status.textContent=err.name==="NotAllowedError"?"JOY-CON PERMISSION CANCELED":("Joy-Con connection failed: "+(err.message||err.name));button.textContent="CONNECT JOY-CON";button.disabled=false}}
document.getElementById("joycon").addEventListener("click",connectJoyCon);
if("hid" in navigator){navigator.hid.addEventListener("disconnect",e=>{joycons.delete(e.device.productId);if(!joycons.size){joyconState.x=0;joyconState.z=0;document.getElementById("joycon").textContent="CONNECT JOY-CON";document.getElementById("joycon").disabled=false}});navigator.hid.getDevices().then(devices=>devices.filter(d=>d.vendorId===JOYCON_VENDOR&&JOYCON_PRODUCTS.has(d.productId)).forEach(setupJoyCon)).catch(()=>{})}
let squidForm=false,squidEnterY=1.6,squidHeightReady=false,squidBaselineSamples=0,squidBaselineSum=0;const SQUID_ENTER_DROP=.28,SQUID_EXIT_DROP=.12;
function updateSquidForm(){if(!renderer.xr.isPresenting)return;const xrCamera=renderer.xr.getCamera(camera);const headY=xrCamera.position.y;if(!squidHeightReady){squidBaselineSum+=headY;squidBaselineSamples++;if(squidBaselineSamples>=20){squidEnterY=squidBaselineSum/squidBaselineSamples;squidHeightReady=true}return}if(!squidForm&&headY<squidEnterY-SQUID_ENTER_DROP){squidForm=true;document.getElementById("status").textContent="SQUID FORM! 🦑"}else if(squidForm&&headY>squidEnterY-SQUID_EXIT_DROP){squidForm=false;document.getElementById("status").textContent="VR ACTIVE • Look + ink"}}
function getController(){const pads=navigator.getGamepads?navigator.getGamepads():[];if(controllerIndex!==null&&pads[controllerIndex]?.connected)return pads[controllerIndex];for(const gp of pads)if(gp?.connected){controllerIndex=gp.index;return gp}controllerIndex=null;return null}
addEventListener("gamepadconnected",e=>controllerIndex=e.gamepad.index);addEventListener("gamepaddisconnected",e=>{if(controllerIndex===e.gamepad.index)controllerIndex=null});
let joyconFireLatch=false,joyconBooyahLatch=false;
function joyconInput(){const fire=joyconState.fire,down=joyconState.booyah;if(fire&&!joyconFireLatch)shoot();if(down&&!joyconBooyahLatch)booyah();joyconFireLatch=fire;joyconBooyahLatch=down;return{x:joyconState.x,z:joyconState.z}}
function controllerInput(){const gp=getController();if(!gp)return{x:0,z:0};let x=gp.axes[0]||0,z=gp.axes[1]||0;if(Math.abs(x)<.15&&Math.abs(z)<.15){if(gp.buttons[14]?.pressed)x=-1;if(gp.buttons[15]?.pressed)x=1;if(gp.buttons[12]?.pressed)z=-1;if(gp.buttons[13]?.pressed)z=1}const down=!!gp.buttons[13]?.pressed;if(down&&!booyahLatch)booyah();booyahLatch=down;return{x,z}}
const clock=new THREE.Clock();const moveVelocity=new THREE.Vector3();
function animate(){const dt=Math.min(clock.getDelta(),.05);shotCooldown=Math.max(0,shotCooldown-dt);updateSquidForm();for(const m of targetMotion){if(m.t.material.color.getHex()!==0x22d3ee){m.t.position.x=m.homeX+Math.sin(performance.now()*.0012+m.phase)*.65;m.t.position.y=1.3+Math.sin(performance.now()*.0017+m.phase)*.18}}const pad=controllerInput();const jc=joyconInput();const touchX=(keys.has("right")?1:0)-(keys.has("left")?1:0);const touchZ=(keys.has("down")?1:0)-(keys.has("up")?1:0);const inputX=Math.abs(jc.x)>.15?jc.x:(Math.abs(pad.x)>.15?pad.x:touchX);const inputZ=Math.abs(jc.z)>.15?jc.z:(Math.abs(pad.z)>.15?pad.z:touchZ);const inputLen=Math.hypot(inputX,inputZ);let targetVX=0,targetVZ=0;if(inputLen>.01){targetVX=inputX/inputLen;targetVZ=inputZ/inputLen;const speed=squidForm?4.2:2.4;const dir=new THREE.Vector3(targetVX,0,targetVZ);dir.applyQuaternion(player.quaternion);targetVX=dir.x*speed;targetVZ=dir.z*speed}const response=inputLen>.01?10:14;moveVelocity.x=THREE.MathUtils.damp(moveVelocity.x,targetVX,response,dt);moveVelocity.z=THREE.MathUtils.damp(moveVelocity.z,targetVZ,response,dt);player.position.x+=moveVelocity.x*dt;player.position.z+=moveVelocity.z*dt;player.position.x=THREE.MathUtils.clamp(player.position.x,-6.2,6.2);player.position.z=THREE.MathUtils.clamp(player.position.z,-6.2,6.2);renderer.render(scene,camera)}
renderer.setAnimationLoop(animate);addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
