<!doctype html>
<html lang="en">
<head>

<title>Ink Arena VR</title>
<style>

#controls{position:fixed;z-index:6;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.pad{display:grid;grid-template-columns:48px 48px 48px;gap:6px;pointer-events:auto}.pad button,.action{width:48px;height:48px;border:0;border-radius:14px;background:#ffffff25;color:white;font-size:20px}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1}.pad button:nth-child(3){grid-column:2}.pad button:nth-child(4){grid-column:3}.actions{display:flex;gap:8px;align-items:end;pointer-events:auto}.fire{width:72px;height:72px;border-radius:50%;background:#f97316;font-size:14px;font-weight:800}.booyah{width:72px;height:56px;border-radius:16px;background:#22d3ee;font-size:12px;font-weight:900}
.cameraToggle{margin-top:8px;margin-right:6px;padding:9px 12px;border:0;border-radius:10px;background:#ffffff25;color:white;font-weight:800;font-size:12px;pointer-events:auto}.cameraToggle.on{background:#22d3ee;color:#06252b}.xrButton{margin-top:8px;padding:9px 12px;border:0;border-radius:10px;background:#ffffff25;color:white;font-weight:800;font-size:12px;pointer-events:auto}.xrButton:disabled{opacity:.55}.topJoycon{margin-top:8px;padding:9px 12px;border:0;border-radius:10px;background:#ffffff25;color:white;font-weight:800;font-size:12px;pointer-events:auto}.topJoycon:active{transform:scale(.97)}#cross{position:fixed;z-index:4;left:50%;top:50%;width:10px;height:10px;margin:-5px;border:2px solid white;border-radius:50%;pointer-events:none}#booyahFlash{position:fixed;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none;font-size:42px;font-weight:1000;opacity:0;transform:scale(.8)}#booyahFlash.show{animation:booyah .65s ease-out}@keyframes booyah{0%{opacity:0;transform:scale(.7) rotate(-5deg)}20%{opacity:1;transform:scale(1.15) rotate(3deg)}100%{opacity:0;transform:scale(1.5)}}

</head>
<body>
<div id="ui"><div class="card"><b>🦑 INK ARENA VR</b><br><span id="status">Press ENTER VR</span><div id="stats">Ink: 0 • Targets: 0/5 • Paint: 0% • Booyah: 0</div><button id="cameraToggle" class="cameraToggle" aria-pressed="false">📷 CAMERA TRACKING: OFF</button><button id="xrButton" class="xrButton">ENTER VR</button><button id="joycon" class="topJoycon">CONNECT JOY-CON</button></div></div>
<div id="cross"></div><div id="booyahFlash">BOOYAH! 🦑</div>
<div id="controls"><div class="pad"><button data-move="up">▲</button><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div><div class="actions"><button class="action booyah" id="booyah">BOOYAH!</button><button class="action fire" id="fire">INK!</button><button class="action" id="reset">RESET</button></div></div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const scene=new THREE.Scene();scene.background=new THREE.Color(0x11152b);scene.fog=new THREE.Fog(0x11152b,8,32);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.03,100);camera.position.y=1.6;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;document.body.appendChild(renderer.domElement);document.body.appendChild(VRButton.createButton(renderer));
const xrCameraTracking={enabled:false,mode:"vr"};
const cameraToggle=document.getElementById("cameraToggle");
const xrButton=document.getElementById("xrButton");
async function updateCameraTrackingSupport(){
  if(!navigator.xr){cameraToggle.disabled=true;cameraToggle.textContent="📷 CAMERA TRACKING: UNSUPPORTED";return}
  try{const ar=await navigator.xr.isSessionSupported("immersive-ar");cameraToggle.disabled=false;cameraToggle.title=ar?"Uses WebXR camera-based tracking when AR XR is available.":"This device/browser does not expose immersive AR tracking.";}
  catch{cameraToggle.disabled=false;}
}
function setCameraTrackingUI(){cameraToggle.classList.toggle("on",xrCameraTracking.enabled);cameraToggle.setAttribute("aria-pressed",String(xrCameraTracking.enabled));cameraToggle.textContent=xrCameraTracking.enabled?"📷 CAMERA TRACKING: ON":"📷 CAMERA TRACKING: OFF";}
cameraToggle.addEventListener("click",()=>{if(renderer.xr.isPresenting){document.getElementById("status").textContent="EXIT XR FIRST TO CHANGE CAMERA TRACKING";return}xrCameraTracking.enabled=!xrCameraTracking.enabled;setCameraTrackingUI();document.getElementById("status").textContent=xrCameraTracking.enabled?"CAMERA TRACKING ENABLED • Enter XR":"CAMERA TRACKING OFF • Enter VR"});
async function startXR(){
  if(renderer.xr.isPresenting){const s=renderer.xr.getSession();if(s)s.end();return}
  if(!navigator.xr){document.getElementById("status").textContent="WebXR unavailable in this browser";return}
  xrButton.disabled=true;xrButton.textContent="STARTING XR…";
  try{
    let mode="immersive-vr";
    if(xrCameraTracking.enabled){
      try{if(await navigator.xr.isSessionSupported("immersive-ar"))mode="immersive-ar";else throw new Error("AR unavailable");}
      catch{xrCameraTracking.mode="vr";document.getElementById("status").textContent="CAMERA TRACKING UNAVAILABLE • Using VR";}
    }
    const session=await navigator.xr.requestSession(mode,{optionalFeatures:["local-floor","bounded-floor","viewer","dom-overlay"],domOverlay:{root:document.body}});
    xrCameraTracking.mode=mode;
    await renderer.xr.setSession(session);
  }catch(err){console.error("XR start failed",err);document.getElementById("status").textContent=`XR ERROR: ${err.message||err.name}`;}
  finally{xrButton.disabled=false;}
}
xrButton.addEventListener("click",startXR);
renderer.xr.addEventListener("sessionstart",()=>{xrButton.textContent="EXIT XR";const ar=xrCameraTracking.mode==="immersive-ar";if(ar){scene.background=null;renderer.setClearAlpha(0);document.getElementById("status").textContent="CAMERA TRACKING ACTIVE 📷";}else{scene.background=new THREE.Color(0x11152b);renderer.setClearAlpha(1);document.getElementById("status").textContent="VR ACTIVE • Look + ink";}});
renderer.xr.addEventListener("sessionend",()=>{xrButton.textContent="ENTER VR";scene.background=new THREE.Color(0x11152b);renderer.setClearAlpha(1);xrCameraTracking.mode="vr";document.getElementById("status").textContent=xrCameraTracking.enabled?"CAMERA TRACKING READY":"Ready";});
setCameraTrackingUI();updateCameraTrackingSupport();
scene.add(new THREE.HemisphereLight(0xffffff,0x172033,1.5));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(3,8,2);scene.add(sun);
const player=new THREE.Group();player.position.set(0,0,4);player.add(camera);scene.add(player);
const floor=new THREE.Mesh(new THREE.BoxGeometry(14,.12,14),new THREE.MeshStandardMaterial({color:0x28304a,roughness:.85}));floor.position.y=-.06;scene.add(floor);
const wallMat=new THREE.MeshStandardMaterial({color:0x3d4660});for(const [x,z,sx,sz] of [[0,-7,14,.15],[-7,0,.15,14],[7,0,.15,14],[0,7,14,.15]]){const w=new THREE.Mesh(new THREE.BoxGeometry(sx,3,sz),wallMat);w.position.set(x,1.5,z);scene.add(w)}
for(const [x,z] of [[-3,-2],[3,-2],[-2,1],[2,2],[0,-4]]){const o=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2),new THREE.MeshStandardMaterial({color:0x64748b}));o.position.set(x,.6,z);scene.add(o)}
const targets=[];const targetHomes=[[-4,-5],[0,-5],[4,-5],[-4,0],[4,0]];for(const [x,z] of targetHomes){const t=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.15,24),new THREE.MeshStandardMaterial({color:0xf472b6,emissive:0x4a102d,emissiveIntensity:.5}));t.rotation.x=Math.PI/2;t.position.set(x,1.3,z);scene.add(t);targets.push(t)}
const targetMotion=targets.map((t,i)=>({t,homeX:t.position.x,homeZ:t.position.z,phase:i*1.7}));
const inkGroup=new THREE.Group();scene.add(inkGroup);const inkMat=new THREE.MeshStandardMaterial({color:0x22d3ee,emissive:0x064e5b,emissiveIntensity:.45,transparent:true,opacity:.9,roughness:.7});
let inkCount=0,targetCount=0,booyahCount=0;let inkArea=0,shotCooldown=0;

// Squid form: calibrate the headset height after entering VR, then detect a deliberate crouch.
let squidForm=false;
let squidHeightReady=false;
let squidBaselineSamples=0;
let squidBaselineSum=0;
let squidEnterY=1.6;

function updateSquidForm(){
  if(!renderer.xr.isPresenting)return;
  const xrCam=renderer.xr.getCamera();
  const currentY=xrCam.position.y;
  if(!squidHeightReady){
    squidBaselineSum+=currentY;
    squidBaselineSamples++;
    if(squidBaselineSamples>30){
      squidEnterY=squidBaselineSum/squidBaselineSamples;
      squidHeightReady=true;
    }
    return;
  }
  const wasSquid=squidForm;
  squidForm=currentY<squidEnterY-.35;
  if(squidForm!==wasSquid){
    document.getElementById("status").textContent=squidForm?"SQUID FORM! 🦑":"VR ACTIVE • Look + ink";
  }
}
function updateStats(){document.getElementById("stats").textContent="Ink: "+inkCount+" • Targets: "+targetCount+"/5 • Paint: "+inkArea+"% • Booyah: "+booyahCount}
function makeInk(point){const size=.35+Math.random()*.65;inkArea=Math.min(100,Math.round(inkGroup.children.length/1.8));const m=new THREE.Mesh(new THREE.CircleGeometry(size,20),inkMat);m.rotation.x=-Math.PI/2;m.position.set(point.x,.012,point.z);m.scale.x=.7+Math.random()*.6;m.scale.y=.7+Math.random()*.6;inkGroup.add(m);inkCount++;if(inkGroup.children.length>180)inkGroup.remove(inkGroup.children[0]);updateStats()}
const raycaster=new THREE.Raycaster();
function shoot(){if(shotCooldown>0)return;shotCooldown=.18;raycaster.setFromCamera(new THREE.Vector2(0,0),camera);const hits=raycaster.intersectObjects([floor,...targets],false);if(!hits.length)return;const hit=hits[0];if(hit.object!==floor&&hit.object.material.color.getHex()!==0x22d3ee){hit.object.material.color.set(0x22d3ee);hit.object.material.emissive.set(0x064e5b);hit.object.material.emissiveIntensity=.9;targetCount++}makeInk(hit.point);document.getElementById("status").textContent="INK!";setTimeout(()=>document.getElementById("status").textContent=renderer.xr.isPresenting?"VR ACTIVE":"Ready",180);updateStats();if(targetCount===targets.length)document.getElementById("status").textContent="ALL TARGETS INKED! 🎯"}
function booyah(){booyahCount++;updateStats();const f=document.getElementById("booyahFlash");f.classList.remove("show");void f.offsetWidth;f.classList.add("show");document.getElementById("status").textContent="BOOYAH!";setTimeout(()=>document.getElementById("status").textContent=renderer.xr.isPresenting?"VR ACTIVE":"Ready",650)}
document.getElementById("fire").addEventListener("click",shoot);document.getElementById("booyah").addEventListener("click",booyah);
function resetGame(){targetCount=0;inkCount=0;inkArea=0;booyahCount=0;shotCooldown=0;for(const {t,homeX,homeZ} of targetMotion){t.position.x=homeX;t.position.z=homeZ;t.material.color.set(0xf472b6);t.material.emissive.set(0x4a102d);t.material.emissiveIntensity=.5}while(inkGroup.children.length)inkGroup.remove(inkGroup.children[0]);player.position.set(0,0,4);squidForm=false;updateStats();document.getElementById("status").textContent=renderer.xr.isPresenting?"VR ACTIVE • Look + ink":"Ready"}
document.getElementById("reset").addEventListener("click",resetGame);
renderer.xr.addEventListener("sessionstart",()=>{squidForm=false;squidHeightReady=false;squidBaselineSamples=0;squidBaselineSum=0;squidEnterY=1.6;document.getElementById("status").textContent="VR ACTIVE • Calibrating..."});
renderer.xr.addEventListener("sessionend",()=>document.getElementById("status").textContent="Ready");
const keys=new Set();const moveButtons={up:"up",down:"down",left:"left",right:"right"};document.querySelectorAll("[data-move]").forEach(b=>{const k=moveButtons[b.dataset.move];const down=e=>{e.preventDefault();keys.add(k)};const up=e=>{e.preventDefault();keys.delete(k)};b.addEventListener("pointerdown",down);b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);b.addEventListener("pointerleave",up)});
const joycons = new Map();
const JOYCON_VENDOR = 0x057e;
const JOYCON_PRODUCTS = new Set([0x2006, 0x2007]);
const joyconState = {x:0,z:0,fire:false,booyah:false};

function joyconStick(data, offset) {
  if (data.byteLength < offset + 3) return {x:0,y:0};
  const x = data.getUint8(offset) | ((data.getUint8(offset+1) & 0x0f) << 8);
  const y = (data.getUint8(offset+1) >> 4) | (data.getUint8(offset+2) << 4);
  return {
    x: THREE.MathUtils.clamp((x-2048)/2048,-1,1),
    y: THREE.MathUtils.clamp((2048-y)/2048,-1,1)
  };
}

function handleJoyconReport(event) {
  const d = event.data;
  if (event.reportId !== 0x30 || d.byteLength < 12) return;
  const device = event.device;
  const isLeft = device.productId === 0x2006;
  const stick = joyconStick(d, isLeft ? 6 : 9);

  if (isLeft) {
    joyconState.x = stick.x;
    joyconState.z = -stick.y;
  } else if (Math.abs(joyconState.x) < 0.15 && Math.abs(joyconState.z) < 0.15) {
    joyconState.x = stick.x;
    joyconState.z = -stick.y;
  }

  const bR = d.getUint8(3);
  const bL = d.getUint8(5);
  joyconState.fire = !!(bR & 0x08) || !!(bR & 0x40) || !!(bR & 0x80) || !!(bL & 0x40) || !!(bL & 0x80);
  joyconState.booyah = !!(bL & 0x01);
}

async function setupJoyCon(device) {
  if (!device) return;
  if (!device.opened) await device.open();
  device.removeEventListener("inputreport", handleJoyconReport);
  device.addEventListener("inputreport", handleJoyconReport);

  try {
    await device.sendReport(0x01, new Uint8Array([1,0,1,64,64,0,1,64,64,0x40,0x01]));
    await new Promise(r => setTimeout(r, 500));
    await device.sendReport(0x01, new Uint8Array([1,0,64,64,0,1,64,64,0x03,0x30]));
  } catch (err) {
    console.warn("Joy-Con setup command failed", err);
  }

  joycons.set(device.productId, device);
  const button = document.getElementById("joycon");
  const status = document.getElementById("status");
  button.textContent = joycons.size > 1 ? "JOY-CONS CONNECTED" : "JOY-CON CONNECTED";
  status.textContent = `JOY-CON READY • ${device.productName || "Nintendo controller"} • ${device.vendorId.toString(16)}:${device.productId.toString(16)}`;
}

async function connectJoyCon() {
  const status = document.getElementById("status");
  const button = document.getElementById("joycon");

  if (!("hid" in navigator)) {
    status.textContent = "WebHID unavailable in this browser";
    return;
  }

  button.disabled = true;
  button.textContent = "REQUESTING JOY-CON…";
  status.textContent = "WAITING FOR JOY-CON PERMISSION…";

  try {
    const devices = await navigator.hid.requestDevice({
      filters: [
        {vendorId: JOYCON_VENDOR, productId: 0x2006},
        {vendorId: JOYCON_VENDOR, productId: 0x2007}
      ]
    });

    if (!devices.length) {
      status.textContent = "NO JOY-CON EXPOSED TO WEBHID";
      button.textContent = "CONNECT JOY-CON";
      button.disabled = false;
      return;
    }

    for (const device of devices) {
      await setupJoyCon(device);
    }
    button.disabled = false;
  } catch (err) {
    console.error("Joy-Con WebHID error", err);
    status.textContent = err.name === "NotAllowedError"
      ? "JOY-CON PERMISSION CANCELED"
      : `WEBHID ERROR: ${err.message || err.name}`;
    button.textContent = "CONNECT JOY-CON";
    button.disabled = false;
  }
}

document.getElementById("joycon").addEventListener("click", connectJoyCon);

if ("hid" in navigator) {
  navigator.hid.addEventListener("disconnect", event => {
    joycons.delete(event.device.productId);
    if (!joycons.size) {
      joyconState.x = 0;
      joyconState.z = 0;
      joyconState.fire = false;
      joyconState.booyah = false;
      document.getElementById("joycon").textContent = "CONNECT JOY-CON";
      document.getElementById("joycon").disabled = false;
      document.getElementById("status").textContent = "JOY-CON DISCONNECTED";
    }
  });

  navigator.hid.getDevices()
    .then(devices => devices
      .filter(d => d.vendorId === JOYCON_VENDOR && JOYCON_PRODUCTS.has(d.productId))
      .forEach(setupJoyCon))
    .catch(() => {});
}

let controllerIndex = null;
let booyahLatch = false;

// Standard Gamepad API mapping constants for standard controllers/Joy-Cons
const BUTTON_BOOYAH = 11;
const DPAD_UP = 12;
const DPAD_DOWN = 13;
const DPAD_LEFT = 14;
const DPAD_RIGHT = 15;
const AXIS_DEADZONE = 0.15;

function getControllers() {
  return navigator.getGamepads ? Array.from(navigator.getGamepads()) : [];
}

function getController() {
  const pads = getControllers();

  if (controllerIndex !== null && pads[controllerIndex]?.connected) {
    return pads[controllerIndex];
  }

  for (const gp of pads) {
    if (gp?.connected) {
      controllerIndex = gp.index;
      return gp;
    }
  }

  controllerIndex = null;
  return null;
}

function updateGamepadStatus() {
  const pads = getControllers().filter(g => g?.connected);
  const status = document.getElementById("status");
  if (!status) return;

  if (pads.length) {
    const names = pads.map(g => g.id || "GAMEPAD").join(" + ");
    if (typeof joycons === "undefined" || !joycons.size) {
      status.textContent = `GAMEPAD: ${names}`;
    }
  } else if (
    (typeof joycons === "undefined" || !joycons.size) &&
    status.textContent.startsWith("GAMEPAD:")
  ) {
    status.textContent = "VR ACTIVE • Look + ink";
  }
}

window.addEventListener("gamepadconnected", e => {
  controllerIndex = e.gamepad.index;
  updateGamepadStatus();
});

window.addEventListener("gamepaddisconnected", e => {
  if (controllerIndex === e.gamepad.index) {
    controllerIndex = null;
  }
  updateGamepadStatus();
});

let joyconFireLatch = false;
let joyconBooyahLatch = false;

function joyconInput() {
  if (typeof joyconState === "undefined") {
    return { x: 0, z: 0 };
  }

  const fire = !!joyconState.fire;
  const booyahPressed = !!joyconState.booyah;

  if (fire && !joyconFireLatch && typeof shoot === "function") {
    shoot();
  }
  if (booyahPressed && !joyconBooyahLatch && typeof booyah === "function") {
    booyah();
  }

  joyconFireLatch = fire;
  joyconBooyahLatch = booyahPressed;

  let x = joyconState.x || 0;
  let z = joyconState.z || 0;

  if (Math.abs(x) < AXIS_DEADZONE) x = 0;
  if (Math.abs(z) < AXIS_DEADZONE) z = 0;

  return { x, z };
}

function controllerInput() {
  const gp = getController();

  if (!gp) {
    return { x: 0, z: 0 };
  }

  let x = gp.axes[0] || 0;
  let z = gp.axes[1] || 0;

  if (Math.abs(x) < AXIS_DEADZONE) x = 0;
  if (Math.abs(z) < AXIS_DEADZONE) z = 0;

  if (x === 0 && z === 0) {
    if (gp.buttons[DPAD_LEFT]?.pressed) x = -1;
    if (gp.buttons[DPAD_RIGHT]?.pressed) x = 1;
    if (gp.buttons[DPAD_UP]?.pressed) z = -1;
    if (gp.buttons[DPAD_DOWN]?.pressed) z = 1;
  }

  const booyahPressed = !!gp.buttons[BUTTON_BOOYAH]?.pressed;

  if (booyahPressed && !booyahLatch && typeof booyah === "function") {
    booyah();
  }

  booyahLatch = booyahPressed;

  return { x, z };
}
const clock=new THREE.Clock();const moveVelocity=new THREE.Vector3();
function animate(){const dt=Math.min(clock.getDelta(),.05);shotCooldown=Math.max(0,shotCooldown-dt);updateSquidForm();for(const m of targetMotion){if(m.t.material.color.getHex()!==0x22d3ee){m.t.position.x=m.homeX+Math.sin(performance.now()*.0012+m.phase)*.65;m.t.position.y=1.3+Math.sin(performance.now()*.0017+m.phase)*.18}}updateGamepadStatus();const pad=controllerInput();const jc=joyconInput();const touchX=(keys.has("right")?1:0)-(keys.has("left")?1:0);const touchZ=(keys.has("down")?1:0)-(keys.has("up")?1:0);const inputX=Math.abs(jc.x)>.15?jc.x:(Math.abs(pad.x)>.15?pad.x:touchX);const inputZ=Math.abs(jc.z)>.15?jc.z:(Math.abs(pad.z)>.15?pad.z:touchZ);const inputLen=Math.hypot(inputX,inputZ);let targetVX=0,targetVZ=0;if(inputLen>.01){targetVX=inputX/inputLen;targetVZ=inputZ/inputLen;const speed=squidForm?4.2:2.4;const dir=new THREE.Vector3(targetVX,0,targetVZ);dir.applyQuaternion(player.quaternion);targetVX=dir.x*speed;targetVZ=dir.z*speed}const response=inputLen>.01?10:14;moveVelocity.x=THREE.MathUtils.damp(moveVelocity.x,targetVX,response,dt);moveVelocity.z=THREE.MathUtils.damp(moveVelocity.z,targetVZ,response,dt);player.position.x+=moveVelocity.x*dt;player.position.z+=moveVelocity.z*dt;player.position.x=THREE.MathUtils.clamp(player.position.x,-6.2,6.2);player.position.z=THREE.MathUtils.clamp(player.position.z,-6.2,6.2);renderer.render(scene,camera)}
renderer.setAnimationLoop(animate);addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
