window.addEventListener("unhandledrejection",e=>{console.error(e.reason);if(bootStatus)bootStatus.textContent="ERROR: "+(e.reason?.message||"promise error");});
const scene=new THREE.Scene();scene.background=new THREE.Color(0x11152b);scene.fog=new THREE.Fog(0x11152b,10,42);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.03,100);camera.position.set(0,1.6,4);camera.rotation.set(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:false});

const xrCameraTracking={enabled:false,mode:"vr"};
const vrFancyFeatures={headLock:false,handTracking:false};

  headLockToggle.classList.toggle("on",vrFancyFeatures.headLock);headLockToggle.setAttribute("aria-pressed",String(vrFancyFeatures.headLock));headLockToggle.textContent=vrFancyFeatures.headLock?"🧠 HEAD LOCK: ON":"🧠 HEAD LOCK: OFF";
  handTrackingToggle.classList.toggle("on",vrFancyFeatures.handTracking);handTrackingToggle.setAttribute("aria-pressed",String(vrFancyFeatures.handTracking));handTrackingToggle.textContent=vrFancyFeatures.handTracking?"✋ HAND + ARM TRACKING: ON":"✋ HAND + ARM TRACKING: OFF";
}
headLockToggle.addEventListener("click",()=>{vrFancyFeatures.headLock=!vrFancyFeatures.headLock;if(!vrFancyFeatures.headLock){imuHeadOffset.x=0;imuHeadOffset.y=0;imuHeadOffset.z=0;imuHeadVelocity.x=0;imuHeadVelocity.y=0;imuHeadVelocity.z=0;vrMotionRig.position.set(0,0,0);}setVrFancyUI();});
handTrackingToggle.addEventListener("click",()=>{vrFancyFeatures.handTracking=!vrFancyFeatures.handTracking;armTestMode=vrFancyFeatures.handTracking;if(!vrFancyFeatures.handTracking){vrHandJoints.left.visible=false;vrHandJoints.right.visible=false;resetTrackedArmPose();}setVrFancyUI();updateArmFusionUI();});
setVrFancyUI();
const cameraToggle=document.getElementById("cameraToggle");
async function updateCameraTrackingSupport(){
  if(!navigator.xr){
    cameraToggle.disabled=true;
    cameraToggle.textContent="📷 BACK CAMERA TRACKING: UNSUPPORTED";
    return;
  }
  try{
    const arSupported=await navigator.xr.isSessionSupported("immersive-ar");
    cameraToggle.disabled=!arSupported;
    cameraToggle.title=arSupported?"Uses the WebXR environment/back-facing camera tracking provided by the device.":"Back-camera WebXR tracking is unavailable on this device/browser.";
    if(!arSupported)cameraToggle.textContent="📷 CAMERA TRACKING: UNSUPPORTED";
  }catch(err){
    console.warn("Camera tracking support check failed",err);
    cameraToggle.disabled=true;
    cameraToggle.textContent="📷 CAMERA TRACKING: UNSUPPORTED";
  }
}
function setCameraTrackingUI(){
  cameraToggle.classList.toggle("on",xrCameraTracking.enabled);
  cameraToggle.setAttribute("aria-pressed",String(xrCameraTracking.enabled));
  cameraToggle.textContent=xrCameraTracking.enabled?"📷 BACK CAMERA TRACKING: ON":"📷 BACK CAMERA TRACKING: OFF";
}
cameraToggle.addEventListener("click",()=>{
  if(renderer.xr.isPresenting)return;
  xrCameraTracking.enabled=!xrCameraTracking.enabled;
  setCameraTrackingUI();
  document.getElementById("status").textContent=xrCameraTracking.enabled?"CAMERA TRACKING ON • Enter VR":"CAMERA TRACKING OFF • Enter VR";
});
updateCameraTrackingSupport();
setCameraTrackingUI();

const motionTestButton=document.getElementById("motionTest");
const motionTelemetry={ax:0,ay:0,az:0,gx:0,gy:0,gz:0,active:false,source:"none"};
let motionListenerAttached=false;
function fmtMotion(v){return Number.isFinite(v)?v.toFixed(2):"--";}
function updateMotionStatus(){
  const input=document.getElementById("vrInputStatus");
  if(!input)return;
  if(motionTelemetry.active)input.textContent="MOTION: A["+fmtMotion(motionTelemetry.ax)+","+fmtMotion(motionTelemetry.ay)+","+fmtMotion(motionTelemetry.az)+"] m/s² • G["+fmtMotion(motionTelemetry.gx)+","+fmtMotion(motionTelemetry.gy)+","+fmtMotion(motionTelemetry.gz)+"] rad/s";
}
function handleDeviceMotion(event){
  const a=event.acceleration||event.accelerationIncludingGravity;
  const r=event.rotationRate;
  motionTelemetry.ax=Number.isFinite(a?.x)?a.x:0;
  motionTelemetry.ay=Number.isFinite(a?.y)?a.y:0;
  motionTelemetry.az=Number.isFinite(a?.z)?a.z:0;
  motionTelemetry.gx=Number.isFinite(r?.alpha)?r.alpha*Math.PI/180:0;
  motionTelemetry.gy=Number.isFinite(r?.beta)?r.beta*Math.PI/180:0;
  motionTelemetry.gz=Number.isFinite(r?.gamma)?r.gamma*Math.PI/180:0;
  motionTelemetry.active=true;
  motionTelemetry.source="devicemotion";
  updateMotionStatus();
}
async function startMotionSensors(){
  if(!("DeviceMotionEvent" in window)){
    document.getElementById("status").textContent="MOTION UNSUPPORTED • DeviceMotionEvent unavailable";
    return;
  }
  motionTestButton.disabled=true;
  motionTestButton.textContent="📱 REQUESTING MOTION…";
  try{
    if(typeof DeviceMotionEvent.requestPermission==="function"){
      const permission=await DeviceMotionEvent.requestPermission();
      if(permission!=="granted")throw new Error("Motion permission was denied");
    }
    if(!motionListenerAttached){
      window.addEventListener("devicemotion",handleDeviceMotion);
      motionListenerAttached=true;
    }
    motionTelemetry.active=false;
    motionTestButton.textContent="📱 MOTION ACTIVE";
    document.getElementById("status").textContent="MOTION SENSOR READY • Move the phone";
    updateMotionStatus();
  }catch(err){
    console.warn("Motion sensor start failed",err);
    document.getElementById("status").textContent="MOTION ERROR • "+(err?.message||"permission unavailable");
    motionTestButton.textContent="📱 MOTION TEST";
  }finally{
    motionTestButton.disabled=false;
  }
}
motionTestButton.addEventListener("click",startMotionSensors);
const cameraAccessButton=document.getElementById("cameraAccess");
let cameraStream=null;
let cameraTrack=null;
const cameraConstraints={video:{facingMode:{ideal:"environment"}},audio:false};
async function getBackCameraStream(){
  if(!navigator.mediaDevices?.getUserMedia)throw new Error("getUserMedia unavailable");
  if(cameraStream?.active&&cameraTrack?.readyState==="live")return cameraStream;
  cameraStream=await navigator.mediaDevices.getUserMedia(cameraConstraints);
  cameraTrack=cameraStream.getVideoTracks()[0]||null;
  return cameraStream;
}
function cameraDescription(){
  const settings=cameraTrack?.getSettings?.()||{};
  const facing=settings.facingMode;
  const label=cameraTrack?.label||"environment camera";
  return facing==="environment"||/back|rear|environment/i.test(label)
    ?"BACK CAMERA READY • "+label
    :"CAMERA READY • requested back camera • "+label;
}
async function requestCameraAccess(){
  if(!navigator.mediaDevices?.getUserMedia){
    document.getElementById("status").textContent="CAMERA UNSUPPORTED • getUserMedia unavailable";
    return;
  }
  cameraAccessButton.disabled=true;
  cameraAccessButton.textContent="📷 REQUESTING BACK CAMERA…";
  try{
    await getBackCameraStream();
    document.getElementById("status").textContent=cameraDescription();
    cameraAccessButton.textContent="📷 BACK CAMERA: ON";
  }catch(err){
    console.warn("Back camera access request failed",err);
    document.getElementById("status").textContent="BACK CAMERA FAILED • "+(err?.name||"unknown error");
    cameraAccessButton.textContent="📷 REQUEST BACK CAMERA";
  }finally{
    cameraAccessButton.disabled=false;
  }
}
cameraAccessButton.addEventListener("click",requestCameraAccess);

const imuHeadOffset={x:0,y:0,z:0};
const imuHeadVelocity={x:0,y:0,z:0};
const imuHeadBias={x:0,y:0,z:0};
let imuLastTime=0;
let imuRecentSamples=[];
function resetVrImuHead(){
  if(!renderer.xr.isPresenting)return;
  imuHeadOffset.x=0;imuHeadOffset.y=0;imuHeadOffset.z=0;
  imuHeadVelocity.x=0;imuHeadVelocity.y=0;imuHeadVelocity.z=0;
  imuHeadBias.x=motionTelemetry.ax||0;imuHeadBias.y=motionTelemetry.ay||0;imuHeadBias.z=motionTelemetry.az||0;
  imuLastTime=performance.now();
  imuRecentSamples=[];
  vrMotionRig.position.set(0,0,0);
  document.getElementById("status").textContent="VR IMU RECENTERED • Square";
}
function updateVrImuHead(){
  if(!vrFancyFeatures.headLock||!renderer.xr.isPresenting||!motionTelemetry.active)return;
  const now=performance.now();
  if(!imuLastTime){imuLastTime=now;return;}
  const dt=Math.min((now-imuLastTime)/1000,.05);
  imuLastTime=now;
  const ax=motionTelemetry.ax-imuHeadBias.x;
  const ay=motionTelemetry.ay-imuHeadBias.y;
  const az=motionTelemetry.az-imuHeadBias.z;
  const dead=.18;
  const x=Math.abs(ax)>dead?ax:0;
  const y=Math.abs(ay)>dead?ay:0;
  const z=Math.abs(az)>dead?az:0;
  imuHeadVelocity.x=(imuHeadVelocity.x+x*dt)*.965;
  imuHeadVelocity.y=(imuHeadVelocity.y+y*dt)*.965;
  imuHeadVelocity.z=(imuHeadVelocity.z+z*dt)*.965;
  imuHeadOffset.x=THREE.MathUtils.clamp(imuHeadOffset.x+imuHeadVelocity.x*dt,-.65,.65);
  imuHeadOffset.y=THREE.MathUtils.clamp(imuHeadOffset.y+imuHeadVelocity.y*dt,-.35,.35);
  imuHeadOffset.z=THREE.MathUtils.clamp(imuHeadOffset.z+imuHeadVelocity.z*dt,-.65,.65);
  vrMotionRig.position.set(imuHeadOffset.x,imuHeadOffset.y,imuHeadOffset.z);
}
const armTestToggle=document.getElementById("armTestToggle");
const debugToggle=document.getElementById("debugToggle");
const hitboxToggle=document.getElementById("hitboxToggle");
let debugMode=false;
let hitboxMode=false;
debugToggle.addEventListener("click",()=>{
  debugMode=!debugMode;
  debugToggle.classList.toggle("on",debugMode);
  debugToggle.setAttribute("aria-pressed",String(debugMode));
  debugToggle.textContent=debugMode?"🧪 DEBUG: ON":"🧪 DEBUG: OFF";
  hitboxToggle.style.display=debugMode?"inline-block":"none";
  if(!debugMode){hitboxMode=false;hitboxGroup.visible=false;hitboxToggle.classList.remove("on");hitboxToggle.setAttribute("aria-pressed","false");hitboxToggle.textContent="▣ HITBOXES: OFF";}
  document.getElementById("status").textContent=debugMode?"DEBUG ON • Hitboxes available":"Ready";
});
hitboxToggle.addEventListener("click",()=>{
  if(!debugMode)return;
  hitboxMode=!hitboxMode;
  hitboxGroup.visible=hitboxMode;
  hitboxToggle.classList.toggle("on",hitboxMode);

  hitboxToggle.textContent=hitboxMode?"▣ HITBOXES: ON":"▣ HITBOXES: OFF";
  document.getElementById("status").textContent=hitboxMode?"HITBOXES ON • Yellow = collision":"DEBUG ON • Hitboxes available";
});
let armTestMode=false;
armTestToggle.addEventListener("click",()=>{
  armTestMode=!armTestMode;
  armTestToggle.classList.toggle("on",armTestMode);
  armTestToggle.setAttribute("aria-pressed",String(armTestMode));
  armTestToggle.textContent=armTestMode?"🦾 ARM TEST: HAND FUSION ON":"🦾 ARM TEST: OFF";
  document.getElementById("status").textContent=armTestMode?"ARM TEST MODE • Sticks move arms":(renderer.xr.isPresenting?"VR ACTIVE • Look + ink":"Ready");
});

// Three.js VR entry button. Keep this as the single VR button creation point.
const vrButton=VRButton.createButton(renderer,{optionalFeatures:["hand-tracking"]});
document.body.appendChild(vrButton);

// VR INPUT PASS: WebXR controller/hand pose tracking.
const vrHands=new THREE.Group();scene.add(vrHands);
const vrHandVisuals={left:new THREE.Group(),right:new THREE.Group()};
const vrHandJoints={left:new THREE.Group(),right:new THREE.Group()};
const XR_HAND_JOINTS=[
  "wrist","thumb-metacarpal","thumb-phalanx-proximal","thumb-phalanx-distal","thumb-tip",
  "index-finger-metacarpal","index-finger-phalanx-proximal","index-finger-phalanx-intermediate","index-finger-phalanx-distal","index-finger-tip",
  "middle-finger-metacarpal","middle-finger-phalanx-proximal","middle-finger-phalanx-intermediate","middle-finger-phalanx-distal","middle-finger-tip",
  "ring-finger-metacarpal","ring-finger-phalanx-proximal","ring-finger-phalanx-intermediate","ring-finger-phalanx-distal","ring-finger-tip",
  "pinky-finger-metacarpal","pinky-finger-phalanx-proximal","pinky-finger-phalanx-intermediate","pinky-finger-phalanx-distal","pinky-finger-tip"
];
const vrHandJointMeshes={left:[],right:[]};
const vrHandColors={left:0x67e8f9,right:0xf472b6};
for(const side of ["left","right"]){
  const g=vrHandVisuals[side];
  const palm=new THREE.Mesh(new THREE.SphereGeometry(.075,12,8),new THREE.MeshStandardMaterial({color:vrHandColors[side],roughness:.5,emissive:vrHandColors[side],emissiveIntensity:.18}));
  g.add(palm);
  const pointer=new THREE.Mesh(new THREE.CapsuleGeometry(.025,.13,4,8),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.45}));
  pointer.position.set(0,0,-.10);pointer.rotation.x=Math.PI/2;g.add(pointer);
  g.visible=false;vrHands.add(g);
  const jointGroup=vrHandJoints[side];
  for(const jointName of XR_HAND_JOINTS){
    const joint=new THREE.Mesh(new THREE.SphereGeometry(.012,8,6),new THREE.MeshStandardMaterial({color:vrHandColors[side],roughness:.6,emissive:vrHandColors[side],emissiveIntensity:.15}));
    joint.visible=false;
    jointGroup.add(joint);
    vrHandJointMeshes[side].push(joint);
  }
  jointGroup.visible=false;
  vrHands.add(jointGroup);
}
const vrControllers=[renderer.xr.getController(0),renderer.xr.getController(1)];
const vrGrips=[renderer.xr.getControllerGrip(0),renderer.xr.getControllerGrip(1)];
vrControllers.forEach(c=>scene.add(c));
vrGrips.forEach((g,i)=>{g.add(vrHandVisuals[i===0?"left":"right"]);scene.add(g);});
function refreshVRInputSources(){
  const session=renderer.xr.getSession();
  const sources=session?Array.from(session.inputSources):[];
  const status=document.getElementById("vrInputStatus");
  if(!status)return;
  if(!renderer.xr.isPresenting){status.textContent="VR INPUT: waiting";return;}
  const tracked=sources.filter(s=>s.gripSpace||s.hand).length;
  const hands=sources.filter(s=>s.hand).length;
  status.textContent=hands?"VR INPUT: "+hands+" hand"+(hands===1?"":"s")+" tracked":"VR INPUT: "+tracked+" controller"+(tracked===1?"":"s")+" tracked";
}
const trackedArmState={left:{active:false,position:new THREE.Vector3(),wrist:new THREE.Vector3()},right:{active:false,position:new THREE.Vector3(),wrist:new THREE.Vector3()}};
function resetTrackedArmPose(){
  trackedArmState.left.active=false;trackedArmState.right.active=false;
}
function updateTrackedArm(side,worldWrist,worldIndex){
  const arm=playerBody.userData[side+"Arm"];if(!arm)return;
  const shoulderWorld=new THREE.Vector3();arm.getWorldPosition(shoulderWorld);
  const targetWorld=worldIndex||worldWrist;
  const parentWorldQuat=new THREE.Quaternion();playerBody.getWorldQuaternion(parentWorldQuat);
  const localTarget=targetWorld.clone();player.worldToLocal(localTarget);
  const shoulderLocal=shoulderWorld.clone();player.worldToLocal(shoulderLocal);
  const dx=localTarget.x-shoulderLocal.x;
  const dy=localTarget.y-shoulderLocal.y;
  const dz=localTarget.z-shoulderLocal.z;
  const horizontal=Math.hypot(dx,dz);
  const yaw=Math.atan2(dx,dz);
  const pitch=Math.atan2(dy,Math.max(.001,horizontal));
  arm.rotation.y=THREE.MathUtils.damp(arm.rotation.y,yaw,14,1/60);
  arm.rotation.x=THREE.MathUtils.damp(arm.rotation.x,-pitch,14,1/60);
  arm.rotation.z=THREE.MathUtils.damp(arm.rotation.z,side==="left"?.12:-.12,14,1/60);
  trackedArmState[side].active=true;
  trackedArmState[side].wrist.copy(worldWrist);
}
function applyTrackedArmFusion(){
  if(!armTestMode||!vrFancyFeatures.handTracking||!renderer.xr.isPresenting)return;
  for(const side of ["left","right"]){
    if(trackedArmState[side].active){
      const wrist=trackedArmState[side].wrist;
      updateTrackedArm(side,wrist,wrist);
    }
  }
}

function updateVRTracking(){
  if(!renderer.xr.isPresenting){
    vrHandVisuals.left.visible=false;vrHandVisuals.right.visible=false;
    vrHandJoints.left.visible=false;vrHandJoints.right.visible=false;
    return;
  }
  const session=renderer.xr.getSession();if(!session)return;
  const frame=renderer.xr.getFrame();
  const refSpace=renderer.xr.getReferenceSpace();
  const sources=Array.from(session.inputSources);
  for(const side of ["left","right"]){
    const source=sources.find(s=>s.handedness===side);
    const visual=vrHandVisuals[side];
    const jointGroup=vrHandJoints[side];
    if(!source){
      visual.visible=false;jointGroup.visible=false;trackedArmState[side].active=false;
      continue;
    }
    const hasHand=vrFancyFeatures.handTracking&&!!source.hand;
    if(!hasHand)trackedArmState[side].active=false;
    visual.visible=!hasHand&&!!source.gripSpace;
    jointGroup.visible=hasHand&&!!frame&&!!refSpace;
    if(hasHand&&frame&&refSpace){
      for(let i=0;i<XR_HAND_JOINTS.length;i++){
        const jointSpace=source.hand.get(XR_HAND_JOINTS[i]);
        const wristPose=frame.getJointPose(source.hand.get("wrist"),refSpace);
        const indexPose=frame.getJointPose(source.hand.get("index-finger-tip"),refSpace);
        if(i===0&&wristPose){
          const wp=new THREE.Vector3(wristPose.transform.position.x,wristPose.transform.position.y,wristPose.transform.position.z);
          const ip=indexPose?new THREE.Vector3(indexPose.transform.position.x,indexPose.transform.position.y,indexPose.transform.position.z):wp.clone();
          const handWorld=wp;
          const indexWorld=ip;
          trackedArmState[side].wrist.copy(handWorld);
          trackedArmState[side].position.copy(indexWorld);
          trackedArmState[side].active=true;
        }
        const jointMesh=vrHandJointMeshes[side][i];
        const pose=jointSpace?frame.getJointPose(jointSpace,refSpace):null;
        if(pose){
          jointMesh.visible=true;
          jointMesh.position.set(pose.transform.position.x,pose.transform.position.y,pose.transform.position.z);
          jointMesh.quaternion.set(pose.transform.orientation.x,pose.transform.orientation.y,pose.transform.orientation.z,pose.transform.orientation.w);
          const r=Number.isFinite(pose.radius)?Math.max(.006,pose.radius):.012;

// The game polls controller state directly every frame. Browser/Android still owns
// the underlying HID connection, but this keeps gameplay input responsive.
const joycons = new Map();
const JOYCON_VENDOR = 0x057e;
const JOYCON_PRODUCTS = new Set([0x2006, 0x2007]);
const joyconState = {x:0,z:0,fire:false,booyah:false,leftTrigger:false};

function joyconStick(data, offset) {
  if (data.byteLength < offset + 3) return {x:0,y:0};
  const x = data.getUint8(offset) | ((data.getUint8(offset+1) & 0x0f) << 8);
  const y = (data.getUint8(offset+1) >> 4) | (data.getUint8(offset+2) << 4);
  return {
    x: THREE.MathUtils.clamp((x-2048)/2048,-1,1),
    y: THREE.MathUtils.clamp((2048-y)/2048,-1,1)
  };
}

function handleJoyconReport(event) {
  const d = event.data;
  if (event.reportId !== 0x30 || d.byteLength < 12) return;
  const device = event.device;
  const isLeft = device.productId === 0x2006;
  const stick = joyconStick(d, isLeft ? 6 : 9);

  if (isLeft) {
    joyconState.x = stick.x;
    joyconState.z = -stick.y;
  } else if (Math.abs(joyconState.x) < AXIS_DEADZONE && Math.abs(joyconState.z) < AXIS_DEADZONE) {
    joyconState.x = stick.x;
    joyconState.z = -stick.y;
  }

  const bR = d.getUint8(3);
  const bL = d.getUint8(5);
  joyconState.fire = !!(bR & 0x08) || !!(bR & 0x40) || !!(bR & 0x80) || !!(bL & 0x40) || !!(bL & 0x80);
  joyconState.booyah = !!(bL & 0x01);
  // Joy-Con ZL is 0x80 in the left-controller button byte.
  // 0x04 is a D-pad bit and must not trigger Squidbomb pickup.
  joyconState.leftTrigger = !!(bL & 0x80);
}

async function setupJoyCon(device) {
  if (!device) return;
  try {
    if (!device.opened) await device.open();
  } catch (err) {
    console.warn("Joy-Con HID open failed", err);
    return;
  }

  device.removeEventListener("inputreport", handleJoyconReport);
  device.addEventListener("inputreport", handleJoyconReport);

  try {
    // Put the Joy-Con into standard full-report mode (0x30).
    // The old setup packet was malformed, so ZL could exist physically
    // without ever reaching inputreport.
    await device.sendReport(0x01, new Uint8Array([
      0x01,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x03,0x30
    ]));
    await new Promise(r => setTimeout(r, 150));
  } catch (err) {
    console.warn("Joy-Con report-mode setup failed", err);
  }

  joycons.set(device.productId, device);
  const button = document.getElementById("joycon");
  const status = document.getElementById("status");
  button.textContent = joycons.size > 1 ? "JOY-CONS CONNECTED" : "JOY-CON CONNECTED";
  status.textContent = `JOY-CON READY • ${device.productName || "Nintendo controller"}`;
}

async function connectJoyCon() {
  const status = document.getElementById("status");
  const button = document.getElementById("joycon");

  if (!("hid" in navigator)) {
    status.textContent = "WebHID unavailable • Using Gamepad API";
    return;
  }

  button.disabled = true;
  button.textContent = "REQUESTING JOY-CON…";
  status.textContent = "WAITING FOR JOY-CON PERMISSION…";

  try {
    const devices = await navigator.hid.requestDevice({
      filters: [
        {vendorId: JOYCON_VENDOR, productId: 0x2006},
        {vendorId: JOYCON_VENDOR, productId: 0x2007}
      ]
    });

    if (!devices.length) {
      status.textContent = "NO WEBHID JOY-CON • Using Gamepad API";
      button.textContent = "CONNECT JOY-CON";
      button.disabled = false;
      return;
    }

    for (const device of devices) await setupJoyCon(device);
    button.disabled = false;
  } catch (err) {
    console.warn("WebHID Joy-Con connection failed; using Gamepad API", err);
    status.textContent = "JOY-CON ACTIVE VIA GAMEPAD API";
    button.textContent = "JOY-CON READY";
    button.disabled = false;
  }
}

      if(ball.position.x>arena){ball.position.x=arena;ballVelocity.x=-Math.abs(ballVelocity.x)*BALL_RESTITUTION;}
      if(ball.position.z<-arena){ball.position.z=-arena;ballVelocity.z=Math.abs(ballVelocity.z)*BALL_RESTITUTION;}
      if(ball.position.z>arena){ball.position.z=arena;ballVelocity.z=-Math.abs(ballVelocity.z)*BALL_RESTITUTION;}

function controllerInput() {
  if(renderer.xr.isPresenting){

    window.__vrSquareLatch=squarePressed;

  // Poll directly every frame. This does not override Chrome/Android ownership,
  // but avoids waiting for browser events before gameplay sees the current state.
  const pads = getControllers().filter(gp => gp?.connected);
  if (!pads.length) return { x: 0, z: 0 };

  let x = 0;
  let z = 0;
  let booyahPressed = false;
  let firePressed = false;

  for (const gp of pads) {
    // KEEP THE EXISTING AXIS MAPPING UNCHANGED.
    const padX = Number.isFinite(gp.axes?.[0]) ? gp.axes[0] : 0;
    const padZ = Number.isFinite(gp.axes?.[1]) ? gp.axes[1] : 0;

    if (Math.abs(padX) > AXIS_DEADZONE) x = padX;
    if (Math.abs(padZ) > AXIS_DEADZONE) z = padZ;

    if (Math.abs(x) <= AXIS_DEADZONE && Math.abs(z) <= AXIS_DEADZONE) {
      if (gp.buttons[14]?.pressed) x = -1;
      if (gp.buttons[15]?.pressed) x = 1;

      if (gp.buttons[13]?.pressed) z = 1;

    // Right bumpers and triggers (R1/R2) fire ink.
    if (gp.buttons[5]?.pressed || gp.buttons[7]?.pressed ||
        (typeof gp.buttons[7]?.value === "number" && gp.buttons[7].value > 0.5)) {
      firePressed = true;
    }

    if (gp.buttons[8]?.pressed || gp.buttons[9]?.pressed ||
        gp.buttons[10]?.pressed || gp.buttons[11]?.pressed) {
      booyahPressed = true;
    }
  }

  if (firePressed && !gamepadFireLatch && typeof shoot === "function") shoot();
  if (booyahPressed && !booyahLatch && typeof booyah === "function") booyah();

  gamepadFireLatch = firePressed;
  booyahLatch = booyahPressed;

  head.quaternion.copy(playerBody.quaternion).invert().multiply(worldQuat);
}
function updateWalkAnimation(speed){
  const moving=speed>.12;
  const swing=moving?Math.sin(performance.now()*.012)*Math.min(.62,speed*.22):0;
  playerBody.userData.leftLeg.rotation.x=swing;
  playerBody.userData.rightLeg.rotation.x=-swing;
  playerBody.userData.leftArm.rotation.x=-swing*.7;
  playerBody.userData.rightArm.rotation.x=swing*.7;
  playerBody.userData.leftElbow.rotation.x=.18;
  playerBody.userData.rightElbow.rotation.x=.18;
  playerBody.userData.leftKnee.rotation.x=.06;
  playerBody.userData.rightKnee.rotation.x=.06;
  playerBody.position.y=moving?Math.abs(Math.sin(performance.now()*.012))*.012:0;
}
function updateTestArms(x,z){if(!armTestMode)return;const lean=THREE.MathUtils.clamp(x,-1,1)*.85,lift=THREE.MathUtils.clamp(-z,-1,1)*.8;playerBody.userData.leftArm.rotation.z=.12-lean;playerBody.userData.rightArm.rotation.z=-.12+lean;playerBody.userData.leftArm.rotation.x=lift;playerBody.userData.rightArm.rotation.x=lift;}
function getArmTestInput(){
  if(!armTestMode)return {x:0,z:0};
  const pads=getControllers().filter(gp=>gp?.connected);
  for(const gp of pads){
    const x=Number.isFinite(gp.axes?.[2])?gp.axes[2]:0;
    const z=Number.isFinite(gp.axes?.[3])?gp.axes[3]:0;
    if(Math.abs(x)>.15||Math.abs(z)>.15)return {x,z};
  }
  return {x:0,z:0};
}


const PLAYER_RADIUS=.28;
const PLAYER_MAX_SPEED=2.4;
const SQUID_MAX_SPEED=4.2;
const PLAYER_ACCEL=18;
const PLAYER_DECEL=22;
const PHYSICS_STEP=1/120;
let physicsAccumulator=0;
const physicsTemp={forward:new THREE.Vector3(),right:new THREE.Vector3(),desired:new THREE.Vector3()};

function resolvePlayerObstacle(obstacle){
  const minX=obstacle.position.x-.6-PLAYER_RADIUS;
  const maxX=obstacle.position.x+.6+PLAYER_RADIUS;
  const minZ=obstacle.position.z-.6-PLAYER_RADIUS;
  const maxZ=obstacle.position.z+.6+PLAYER_RADIUS;
  if(player.position.x<minX||player.position.x>maxX||player.position.z<minZ||player.position.z>maxZ)return;

  const left=player.position.x-minX;
  const right=maxX-player.position.x;
  const back=player.position.z-minZ;
  const front=maxZ-player.position.z;
  const penetration=Math.min(left,right,back,front);

  if(penetration===left){
    player.position.x=minX;
    if(moveVelocity.x>0)moveVelocity.x=0;
  }else if(penetration===right){
    player.position.x=maxX;
    if(moveVelocity.x<0)moveVelocity.x=0;
  }else if(penetration===back){
    player.position.z=minZ;
    if(moveVelocity.z>0)moveVelocity.z=0;
  }else{
    player.position.z=maxZ;
    if(moveVelocity.z<0)moveVelocity.z=0;
  }
}

function resolveArenaBounds(){
  const limit=14.65-PLAYER_RADIUS;
  if(player.position.x<-limit){player.position.x=-limit;if(moveVelocity.x<0)moveVelocity.x=0;}
  if(player.position.x>limit){player.position.x=limit;if(moveVelocity.x>0)moveVelocity.x=0;}
  if(player.position.z<-limit){player.position.z=-limit;if(moveVelocity.z<0)moveVelocity.z=0;}
  if(player.position.z>limit){player.position.z=limit;if(moveVelocity.z>0)moveVelocity.z=0;}
}

function simulatePlayerPhysics(dt,inputX,inputZ){
  const inputLen=Math.hypot(inputX,inputZ);
  let desiredX=0,desiredZ=0;

  if(inputLen>.001){
    physicsTemp.forward.set(0,0,-1).applyQuaternion(getActiveCamera().quaternion);
    physicsTemp.forward.y=0;
    if(physicsTemp.forward.lengthSq()<.0001)physicsTemp.forward.set(0,0,-1);
    physicsTemp.forward.normalize();

    physicsTemp.right.set(1,0,0).applyQuaternion(getActiveCamera().quaternion);
    physicsTemp.right.y=0;
    physicsTemp.right.normalize();

    physicsTemp.desired.set(0,0,0)
      .addScaledVector(physicsTemp.right,inputX/inputLen)
      .addScaledVector(physicsTemp.forward,-inputZ/inputLen)
      .normalize();

    const maxSpeed=squidForm?SQUID_MAX_SPEED:PLAYER_MAX_SPEED;
    desiredX=physicsTemp.desired.x*maxSpeed;
    desiredZ=physicsTemp.desired.z*maxSpeed;
  }

  const accel=inputLen>.001?PLAYER_ACCEL:PLAYER_DECEL;
  moveVelocity.x=THREE.MathUtils.damp(moveVelocity.x,desiredX,accel,dt);
  moveVelocity.z=THREE.MathUtils.damp(moveVelocity.z,desiredZ,accel,dt);

  player.position.x+=moveVelocity.x*dt;
  player.position.z+=moveVelocity.z*dt;

  resolveArenaBounds();
  for(const obstacle of solidObstacles)resolvePlayerObstacle(obstacle);
  resolveArenaBounds();
}

function runPlayerPhysics(dt,inputX,inputZ){
  physicsAccumulator=Math.min(physicsAccumulator+dt,.1);
  while(physicsAccumulator>=PHYSICS_STEP){
    simulatePlayerPhysics(PHYSICS_STEP,inputX,inputZ);
    physicsAccumulator-=PHYSICS_STEP;
  }
}

controllerLab.rotation.y+=.006;updateControllerModel();if(motionTelemetry.active)updateMotionStatus();

if(goofyTimer<=0){goofyTimer=10+Math.random()*14;if(!squidForm)document.getElementById("status").textContent=goofyLines[Math.floor(Math.random()*goofyLines.length)];if(Math.random()<.35)renderCube.rotation.y+=Math.PI*2;}

const lookCamera=getActiveCamera();
const lookForward=new THREE.Vector3(0,0,-1).applyQuaternion(lookCamera.quaternion);
lookForward.y=0;
if(lookForward.lengthSq()>.0001){

  playerBody.rotation.y=THREE.MathUtils.damp(playerBody.rotation.y,desiredYaw,3.2,dt);
}
const armInput=getArmTestInput();if(!vrFancyFeatures.handTracking)updateTestArms(armInput.x,armInput.z);
const ballTriggers=getBallTriggerState();
  updateVRTracking();
updateVrImuHead();

}
